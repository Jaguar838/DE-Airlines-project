id: airline_full_load_bq
namespace: afr.de_project

inputs:
  - id: tables
    type: ARRAY
    itemType: STRING
    defaults:
      - flights
      - bookings
      - tickets
      - boarding_passes
      - ticket_flights

  - id: gcp_dataset
    type: STRING
    defaults: de_airlines_dataset

  - id: gcs_bucket_name
    type: STRING
    defaults: qwiklabs-gcp-04-7caaa94073a8-bucket

  - id: gcp_project_id
    type: STRING
    defaults: qwiklabs-gcp-04-7caaa94073a8

  - id: gcp_location
    type: STRING
    defaults: us-west4

  - id: gcp_creds_json
    type: STRING
    defaults: "{{ kv('GCP_CREDS') }}"

variables:
  table_keys:
    flights: flight_id
    bookings: book_ref
    tickets: ticket_no
    boarding_passes: ticket_no, flight_id
    ticket_flights: ticket_no, flight_id

tasks:
  - id: load_all_tables
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ inputs.tables }}"
    tasks:
      - id: download_from_gcs
        type: io.kestra.plugin.gcp.gcs.Download
        from: "gs://{{inputs.gcs_bucket_name}}/airlines/raw/{{ taskrun.value }}.csv"
      - id: bq_load_raw
        type: io.kestra.plugin.gcp.bigquery.Load
        from: "{{ outputs.download_from_gcs[taskrun.value].uri }}"
        destinationTable: "{{inputs.gcp_project_id}}.{{inputs.gcp_dataset}}.{{ taskrun.value }}_tmp"
        format: CSV
        autodetect: true
        writeDisposition: WRITE_TRUNCATE
        ignoreUnknownValues: true
        csvOptions:
          skipLeadingRows: 1

      - id: bq_create_if_not_exists
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          CREATE TABLE IF NOT EXISTS `{{inputs.gcp_project_id}}.{{inputs.gcp_dataset}}.{{ taskrun.value }}`
          AS SELECT * FROM `{{inputs.gcp_project_id}}.{{inputs.gcp_dataset}}.{{ taskrun.value }}_tmp` LIMIT 0

      - id: bq_merge_final
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          MERGE INTO `{{inputs.gcp_project_id}}.{{inputs.gcp_dataset}}.{{ taskrun.value }}` T
          USING `{{inputs.gcp_project_id}}.{{inputs.gcp_dataset}}.{{ taskrun.value }}_tmp` S
          ON {% for key in vars.table_keys[taskrun.value].split(', ') %} T.{{key}} = S.{{key}} {% if not loop.last %} AND {% endif %} {% endfor %}
          WHEN NOT MATCHED THEN INSERT ROW;

      - id: cleanup_tmp
        type: io.kestra.plugin.gcp.bigquery.DeleteTable
        dataset: "{{inputs.gcp_dataset}}"
        table: "{{ taskrun.value }}_tmp"
        
pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{inputs.gcp_creds_json}}"
      projectId: "{{inputs.gcp_project_id}}"
      location: "{{inputs.gcp_location}}"